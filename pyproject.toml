[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bera-price-tracker"
version = "0.1.0"
description = "Price history tracker for BERA motorcycle brake pad listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "brightdata-sdk>=2.5,<3",
    "apify-client>=1.9,<3",
    "python-dotenv>=1.1,<2",
    "reflex>=0.8.5,<0.9",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mutmut>=3.7,<4",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
]

[project.scripts]
bera-price-tracker = "bera_price_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.mutmut]
# Round 2: mutate the two Alibaba monetary modules together.
source_paths = ["src"]
only_mutate = [
    "src/bera_price_tracker/application/alibaba_statistics.py",
    "src/bera_price_tracker/application/alibaba_negotiation.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_alibaba.py",
    "tests/unit/test_alibaba_negotiation.py",
]
use_git_change_detection = false
debug = false

[tool.coverage.run]
branch = true
source = ["bera_price_tracker"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["brightdata", "brightdata.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apify_client", "apify_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reflex", "reflex.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true
