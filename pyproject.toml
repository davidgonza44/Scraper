[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bera-price-tracker"
version = "0.1.0"
description = "Price history tracker for BERA motorcycle brake pad listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "brightdata-sdk>=2.5,<3",
    "apify-client>=1.9,<3",
    "reflex>=0.8.5,<0.9",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
bera-price-tracker = "bera_price_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["brightdata", "brightdata.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apify_client", "apify_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reflex", "reflex.*"]
ignore_missing_imports = true
